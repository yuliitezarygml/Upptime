owner: yuliitezarygml
repo: Upptime

sites:
  - name: MagnumCinema
    url: https://magnumcinema.com/
  - name: MagnumCinema API
    url: https://magnumcinema.com/api/auth/me
    expectedStatusCodes:
      - 200
      - 401
      - 403
  - name: Kino Dev
    url: https://kino.sinkdev.games/

status-website:
  baseUrl: /Upptime
  logoUrl: https://magnumcinema.com/favicon.ico
  name: Magnum Status
  introTitle: "**MagnumCinema** uptime monitor"
  introMessage: |
    Public status page for MagnumCinema production and dev environments.
    Checks run every 5 minutes via [GitHub Actions](https://github.com/yuliitezarygml/Upptime/actions).
  navbar:
    - title: Status
      href: /
    - title: MagnumCinema
      href: https://magnumcinema.com
    - title: GitHub
      href: https://github.com/yuliitezarygml/Upptime

# Optional: Telegram alerts — add repo secrets NOTIFICATION_TELEGRAM, NOTIFICATION_TELEGRAM_BOT_KEY, NOTIFICATION_TELEGRAM_CHAT_ID
# See https://upptime.js.org/docs/configuration
